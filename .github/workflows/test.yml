name: Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies 🔧
        run: npm ci
      - name: Check compiling 🔧
        run: npm run compile
      - name: Check linting 🔧
        run: npm run lint
      - name: Check testing 🔧
        run: npm run test
      - name: Check build 🔧
        run: npm run build
      - name: Check package health (publint + attw) 🔧
        run: npm run check:package
      - name: Check size budgets 🔧
        run: npm run size
